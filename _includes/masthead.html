<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu" style="display: flex; align-items: center; justify-content: space-between;">
      <nav id="site-nav" class="greedy-nav" style="flex-grow: 1;">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg masthead__menu-home-item">
            <a href="#about-me">Homepage</a>
          </li>
          {% for link in site.data.navigation.main %}
            <li class="masthead__menu-item">
              <a href="{{ domain }}{{ link.url }}">{{ link.title }}</a>
            </li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>

      <!-- Dark mode toggle stays on the top bar -->
      <div style="margin-left: 1rem;">
        <button id="theme-toggle" title="Toggle dark mode" style="background: none; border: none; cursor: pointer; font-size: 18px;">
          <span id="theme-icon">🌙</span>
        </button>        
      </div>
    </div>
  </div>
</div>
